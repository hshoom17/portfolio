<!doctype html><html lang="ar" dir="rtl"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<title>تجربة هلثي فود</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --page-bg:#f2f5f3; --page-ink:#17201b; --page-muted:#5d6a63; --page-card:#ffffff; --page-line:#dfe6e2;
  --em:#059669; --em2:#10B981; --mint:#EFFBF4; --mint2:#D3F1E1; --dark:#0C0C0B;
  --amber:#b45309; --amber-soft:#fef3c7; --red:#dc2626; --red-soft:#fee2e2;
  --zinc:#71717a; --zinc-soft:#f4f4f5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page-bg:#101413; --page-ink:#e8efeb; --page-muted:#93a29b; --page-card:#181d1b; --page-line:#28302c; }
}
:root[data-theme="dark"]{ --page-bg:#101413; --page-ink:#e8efeb; --page-muted:#93a29b; --page-card:#181d1b; --page-line:#28302c; }
*{box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--page-bg); color:var(--page-ink); direction:rtl; overflow:hidden;
  font-family:-apple-system,"SF Arabic","Segoe UI","Noto Naskh Arabic UI",Tahoma,sans-serif;
}
button{font-family:inherit; border:0; background:none; cursor:pointer; color:inherit}
input{font-family:inherit}
img{display:block; max-width:100%}
.num{font-variant-numeric:tabular-nums}

/* ---------- page shell ---------- */
#shell{height:100%; display:flex; flex-direction:column}
#topbar{
  flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:10px 18px;
  border-bottom:1px solid var(--page-line); background:var(--page-card);
}
#topbar .logo{width:30px; height:30px; border-radius:9px; background:var(--em); color:#fff; display:grid; place-items:center; font-weight:800; font-size:16px; flex:0 0 auto}
#topbar h1{font-size:15px; font-weight:800; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#topbar .hint{font-size:12px; color:var(--page-muted); margin-inline-start:auto; flex:0 0 auto}
#viewToggle{display:none; gap:6px; margin-inline-start:auto; flex:0 0 auto}
#viewToggle button{padding:7px 14px; border-radius:99px; font-size:13px; font-weight:700; background:var(--page-bg); color:var(--page-muted); border:1px solid var(--page-line)}
#viewToggle button.on{background:var(--em); border-color:var(--em); color:#fff}
#stage{flex:1; min-height:0; display:flex; gap:22px; padding:18px; align-items:stretch; justify-content:center}
#adminWrap{flex:1; min-width:0; display:flex}
#phoneWrap{flex:0 0 auto; min-width:0; display:flex; align-items:center}

/* ---------- phone frame (desktop) ---------- */
#phone{
  width:378px; height:780px; border-radius:52px; background:#000; padding:10px;
  box-shadow:0 24px 60px rgba(0,0,0,.35); position:relative; flex:0 0 auto; transform-origin:center center;
}
#phoneScreen{width:100%; height:100%; border-radius:42px; overflow:hidden; background:#fff; position:relative; display:flex; flex-direction:column}
#notch{position:absolute; top:10px; left:50%; transform:translateX(-50%); width:118px; height:32px; background:#000; border-radius:20px; z-index:60}
#statusbar{flex:0 0 54px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 26px 4px; font-size:13px; font-weight:700; color:#0C0C0B; background:#fff}
#appHeader{flex:0 0 auto; padding:6px 18px 10px; background:#fff; display:flex; align-items:center; justify-content:space-between}
#appHeader .brand{display:flex; align-items:center; gap:8px}
#appHeader .brand .mark{width:30px; height:30px; border-radius:10px; background:var(--em); color:#fff; display:grid; place-items:center; font-weight:800}
#appHeader .brand b{font-size:16px; color:#0C0C0B}
#appHeader .screenTitle{font-size:13px; font-weight:700; color:#8a938e}
#appBody{flex:1; min-height:0; overflow-y:auto; background:#FAFAF9; -webkit-overflow-scrolling:touch}
#tabbar{flex:0 0 64px; background:#fff; border-top:1px solid #ececec; display:flex}
#tabbar button{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:11px; font-weight:700; color:#9ca3af; padding-bottom:6px}
#tabbar button.on{color:var(--em)}
#tabbar svg{width:22px; height:22px}

/* app content */
.pad{padding:16px 18px; display:flex; flex-direction:column; gap:13px}
.greet{font-size:21px; font-weight:900; color:#0C0C0B}
.promo{border-radius:22px; padding:16px 18px; min-height:82px; display:flex; align-items:center; gap:10px; width:100%; text-align:start}
.promo .pbody{flex:1; display:flex; flex-direction:column; gap:5px}
.promo .arrow{width:32px;height:32px;border-radius:16px;background:rgba(255,255,255,.22);display:grid;place-items:center;color:#fff;font-size:16px; flex:0 0 auto}
.promo.dark{background:#0C0C0B}
.promo.mint{background:var(--mint); border:1px solid var(--mint2)}
.promo .t{font-size:16px; font-weight:900; color:#fff}
.promo .s{font-size:12px; color:#D3F1E1}
.promo .tD{font-size:15px; font-weight:900; color:#0C0C0B}
.promo .sD{font-size:12px; font-weight:700; color:#0a7a58}
.secHead{display:flex; align-items:center; justify-content:space-between}
.secHead b{font-size:17px; font-weight:900; color:#0C0C0B}
.secHead button{color:var(--em); font-size:13px; font-weight:700}
.railTitle{font-size:13px; font-weight:800; color:#8a938e}
.rail{display:flex; gap:10px; overflow-x:auto; padding:2px 0 6px; scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.fcard{flex:0 0 128px; background:#fff; border:1px solid #ececec; border-radius:16px; overflow:hidden; text-align:start; padding:0}
.fcard img,.fcard .noimg{width:100%; height:84px; object-fit:cover}
.noimg{background:#f1f3f2; display:grid; place-items:center; color:#b7beba; font-size:22px}
.fcard .fb{padding:8px; display:flex; flex-direction:column; gap:3px}
.fcard .fn{font-size:12.5px; font-weight:700; color:#0C0C0B; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fcard .fp{font-size:11.5px; font-weight:800; color:var(--em)}

/* menu screen */
.cattabs{display:flex; gap:8px; overflow-x:auto; padding:10px 18px; background:#FAFAF9; position:sticky; top:0; z-index:5; scrollbar-width:none}
.cattabs::-webkit-scrollbar{display:none}
.cattabs button{flex:0 0 auto; padding:8px 16px; border-radius:99px; background:#fff; border:1px solid #e5e7eb; font-size:13px; font-weight:700; color:#6b7280}
.cattabs button.on{background:var(--em); border-color:var(--em); color:#fff}
.itemlist{padding:4px 18px 120px; display:flex; flex-direction:column; gap:10px}
.irow{display:flex; align-items:center; gap:12px; background:#fff; border:1px solid #ececec; border-radius:16px; padding:10px; text-align:start; width:100%}
.irow.inCart{border-color:var(--em); border-width:1.5px}
.irow img,.irow .noimg{width:60px; height:60px; border-radius:12px; object-fit:cover; flex:0 0 60px}
.irow .ib{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.irow .inm{font-size:14.5px; font-weight:800; color:#0C0C0B; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.irow .imac{font-size:11.5px; color:#8a938e; font-weight:600}
.irow .ipr{font-size:12.5px; font-weight:800; color:var(--em)}
.irow .plus{width:30px; height:30px; border-radius:15px; background:var(--em); color:#fff; display:grid; place-items:center; font-size:18px; font-weight:700; flex:0 0 30px}
.irow .badge{flex:0 0 auto; padding:5px 10px; border-radius:99px; background:var(--mint); color:var(--em); font-size:11.5px; font-weight:800}

#cartbar{position:absolute; left:14px; right:14px; bottom:76px; z-index:20; background:var(--em); border-radius:18px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 6px 18px rgba(5,150,105,.35); color:#fff; font-weight:800; font-size:14px; animation:up .25s}
#cartbar .cbd{color:#D3F1E1; font-size:13px}
@keyframes up{from{transform:translateY(16px); opacity:0}}

/* sheets */
.sheetBack{position:absolute; inset:0; background:rgba(0,0,0,.45); z-index:40; opacity:0; transition:opacity .2s; display:none}
.sheetBack.open{opacity:1}
.sheet{position:absolute; left:0; right:0; bottom:0; z-index:50; background:#fff; border-radius:26px 26px 0 0; padding:10px 18px 26px; transform:translateY(105%); transition:transform .28s cubic-bezier(.3,.9,.3,1); max-height:88%; overflow-y:auto; display:flex; flex-direction:column; gap:12px}
.sheet.open{transform:none}
.grab{width:40px; height:4px; border-radius:2px; background:#e5e7eb; margin:0 auto; flex:0 0 auto}
.sheet .photo{width:100%; height:170px; border-radius:16px; object-fit:cover; flex:0 0 auto}
.sheet .noimg.photo{height:170px; font-size:34px}
.sheet .nm{font-size:19px; font-weight:900; color:#0C0C0B}
.sheet .grp{font-size:12.5px; color:#8a938e}
.sheet .ptag{font-size:13.5px; font-weight:800; color:var(--em); flex:0 0 auto}
.sheet h3{font-size:17px; font-weight:900; color:#0C0C0B}
.nutri{background:var(--mint); border-radius:16px; padding:12px 14px; display:flex; flex-direction:column; gap:8px}
.nutri .nt{font-size:12px; font-weight:700; color:#5d6a63}
.nutri .nrow{display:flex}
.nutri .ncell{flex:1; text-align:center}
.nutri .nv{font-size:17px; font-weight:900; color:var(--em)}
.nutri .nl{font-size:11px; color:#5d6a63}
.stepRow{display:flex; align-items:center; justify-content:center; gap:18px}
.stepRow button{width:38px; height:38px; border-radius:19px; border:1.5px solid #e5e7eb; background:#fafafa; color:var(--em); font-size:20px; font-weight:800; display:grid; place-items:center}
.stepRow .sv{min-width:84px; text-align:center; font-size:17px; font-weight:900; color:#0C0C0B}
.cta{background:var(--em); color:#fff; border-radius:14px; padding:14px; text-align:center; font-size:15px; font-weight:800; width:100%}
.cta:disabled{opacity:.5}
.linkRed{color:var(--red); font-size:13px; font-weight:700; text-align:center; padding:4px}
.cartLine{display:flex; align-items:center; gap:10px}
.cartLine .x{color:var(--red); font-size:15px; font-weight:800; padding:4px; flex:0 0 auto}
.cartLine .cn{flex:1; min-width:0; font-size:13.5px; font-weight:700; color:#0C0C0B; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:start}
.cartLine .cp{font-size:12.5px; font-weight:800; color:var(--em); flex:0 0 auto}
.noteIn{background:#f4f4f5; border:0; border-radius:12px; padding:11px 14px; font-size:13.5px; width:100%; color:#0C0C0B; text-align:right}

/* orders screen */
.ocard{background:#fff; border:1px solid #ececec; border-radius:16px; padding:13px 14px; display:flex; flex-direction:column; gap:8px}
.ocard .ohead{display:flex; align-items:center; justify-content:space-between}
.chip{padding:4px 11px; border-radius:99px; font-size:11.5px; font-weight:800}
.chip.new{background:var(--amber-soft); color:var(--amber)}
.chip.ready{background:var(--mint); color:var(--em)}
.chip.picked_up{background:var(--zinc-soft); color:var(--zinc)}
.chip.cancelled{background:var(--red-soft); color:var(--red)}
.oid{font-size:14px; font-weight:900; color:#0C0C0B}
.oline{display:flex; justify-content:space-between; gap:8px; font-size:13px; font-weight:600; color:#26312b}
.oline .lp{color:#8a938e; font-weight:700; flex:0 0 auto}
.ototal{display:flex; justify-content:space-between; align-items:center; border-top:1px dashed #ececec; padding-top:8px}
.ototal b{color:var(--em); font-size:15px; font-weight:900}
.ototal span{font-size:11.5px; color:#8a938e}
.onote{font-size:12px; color:#8a938e}
.emptyMsg{text-align:center; color:#8a938e; font-size:13.5px; padding:30px 10px; line-height:1.7}
.pcard{background:#fff; border:1px solid #ececec; border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:4px}
.pcard b{font-size:17px; color:#0C0C0B}
.pcard span{font-size:13px; color:#8a938e; line-height:1.6}

#toast{position:absolute; top:64px; left:16px; right:16px; z-index:70; background:#0C0C0B; color:#fff; border-radius:14px; padding:12px 16px; font-size:13px; font-weight:700; opacity:0; transform:translateY(-10px); transition:all .3s; pointer-events:none}
#toast.show{opacity:1; transform:none}

/* ---------- admin ---------- */
#admin{flex:1; display:flex; min-width:0; background:var(--page-card); border:1px solid var(--page-line); border-radius:18px; overflow:hidden}
#sidebar{flex:0 0 190px; background:#0f0f10; color:#d4d4d8; display:flex; flex-direction:column; padding:14px 10px; gap:2px}
#sidebar .shead{display:flex; align-items:center; gap:8px; padding:6px 8px 16px}
#sidebar .shead .mark{width:30px;height:30px;border-radius:9px;background:var(--em2);color:#0C0C0B;font-weight:800;display:grid;place-items:center}
#sidebar .shead b{color:#fff; font-size:14px}
#sidebar .shead span{display:block; font-size:10.5px; color:#71717a}
#sidebar .nav{display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:10px; font-size:13px; font-weight:600; color:#a1a1aa; width:100%; text-align:start}
#sidebar .nav:hover{background:rgba(255,255,255,.07); color:#fff}
#sidebar .nav.on{background:rgba(16,185,129,.15); color:#34d399}
#sidebar .nav .b{margin-inline-start:auto; background:#f59e0b; color:#18181b; font-size:10.5px; font-weight:800; border-radius:99px; padding:1px 8px}
#sidebar .foot{margin-top:auto; font-size:11px; color:#52525b; padding:8px; line-height:1.6}
#adminMain{flex:1; min-width:0; display:flex; flex-direction:column}
#adminHead{flex:0 0 auto; padding:14px 20px; border-bottom:1px solid var(--page-line); display:flex; align-items:center; gap:14px; flex-wrap:wrap}
#adminHead h2{font-size:16px; font-weight:800}
#adminHead .sub{font-size:12px; color:var(--page-muted)}
#adminHead .filters{display:flex; gap:6px; margin-inline-start:auto}
#adminHead .filters button{padding:6px 13px; border-radius:99px; font-size:12px; font-weight:700; border:1px solid var(--page-line); color:var(--page-muted)}
#adminHead .filters button.on{background:var(--em); border-color:var(--em); color:#fff}
#adminScroll{flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:14px}
#mobileNav{display:none; gap:6px; overflow-x:auto; padding:10px 12px; border-bottom:1px solid var(--page-line); scrollbar-width:none}
#mobileNav::-webkit-scrollbar{display:none}
#mobileNav button{flex:0 0 auto; padding:7px 13px; border-radius:99px; font-size:12.5px; font-weight:700; border:1px solid var(--page-line); color:var(--page-muted)}
#mobileNav button.on{background:var(--em); border-color:var(--em); color:#fff}
.statsRow{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.stat{background:var(--page-bg); border:1px solid var(--page-line); border-radius:14px; padding:12px 14px}
.stat .sv{font-size:20px; font-weight:900}
.stat .sl{font-size:11.5px; color:var(--page-muted); font-weight:600}
.stat.hl .sv{color:var(--em)}
.panel{background:var(--page-bg); border:1px solid var(--page-line); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:9px}
.panel h4{font-size:13px; color:var(--page-muted); font-weight:800}
.krow{display:flex; justify-content:space-between; gap:10px; font-size:13px; font-weight:600; padding:6px 0; border-bottom:1px dashed var(--page-line)}
.krow:last-child{border-bottom:0}
.krow .kq{font-weight:800; color:var(--em); flex:0 0 auto}
.krow .ks{font-size:11.5px; color:var(--page-muted); font-weight:600}
.aorder{border:1px solid var(--page-line); border-radius:14px; padding:13px 16px; display:flex; flex-direction:column; gap:8px; background:var(--page-card)}
.aorder.fresh{animation:flash 1.6s}
@keyframes flash{0%{background:var(--mint)} 100%{}}
.aorder .ahead{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.aorder .cust{font-size:12.5px; color:var(--page-muted); font-weight:600}
.aorder .when{font-size:11.5px; color:var(--page-muted); margin-inline-start:auto}
.aorder .lines{display:flex; flex-direction:column; gap:3px}
.aorder .lines .oline{color:var(--page-ink)}
.aorder .afoot{display:flex; align-items:center; gap:8px; border-top:1px dashed var(--page-line); padding-top:9px; flex-wrap:wrap}
.aorder .tot{font-weight:900; color:var(--em); font-size:14.5px}
.aorder .acts{display:flex; gap:6px; margin-inline-start:auto}
.abtn{padding:7px 14px; border-radius:10px; font-size:12px; font-weight:700}
.abtn.go{background:var(--em); color:#fff}
.abtn.done{background:var(--dark); color:#fff}
.abtn.cancel{background:var(--red-soft); color:var(--red)}
.adminEmpty{text-align:center; color:var(--page-muted); padding:40px 10px; font-size:13.5px; line-height:1.8}
.mrow{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px dashed var(--page-line); font-size:13px}
.mrow:last-child{border-bottom:0}
.mrow .mn{flex:1; min-width:0; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mrow .mc{font-size:11.5px; color:var(--page-muted); flex:0 0 auto}
.mrow .mp{font-weight:800; color:var(--em); flex:0 0 auto}
.setRow{display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px dashed var(--page-line); font-size:13px}
.setRow:last-child{border-bottom:0}
.setRow b{font-weight:800}
.setRow span{color:var(--page-muted); text-align:start}

@media (max-width:1180px){ .statsRow{grid-template-columns:repeat(2,1fr)} }

/* ---------- mobile: natural page scroll, no nested scrollers ---------- */
@media (max-width:920px){
  html,body{height:auto; overflow:visible}
  #shell{min-height:100dvh; height:auto}
  #topbar{position:sticky; top:0; z-index:80}
  #topbar .hint{display:none}
  #topbar h1 .tsub{display:none}
  #viewToggle{display:flex}
  #stage{display:block; padding:0; min-height:0}
  #adminWrap{display:none}
  #phoneWrap{display:block}
  body.showAdmin #adminWrap{display:block; padding:10px}
  body.showAdmin #phoneWrap{display:none}
  #phone{width:100%; height:auto; border-radius:0; padding:0; background:none; box-shadow:none; transform:none !important}
  #phoneScreen{height:auto; min-height:calc(100dvh - 52px); border-radius:0; display:block; overflow:visible}
  #notch,#statusbar{display:none}
  #appBody{overflow:visible; min-height:0; padding-bottom:150px}
  #appHeader{padding-top:10px}
  #tabbar{position:fixed; left:0; right:0; bottom:0; z-index:36; height:64px; padding-bottom:env(safe-area-inset-bottom)}
  #cartbar{position:fixed; bottom:calc(76px + env(safe-area-inset-bottom)); left:14px; right:14px; z-index:37}
  .sheetBack{position:fixed}
  .sheet{position:fixed; max-height:86dvh; padding-bottom:calc(26px + env(safe-area-inset-bottom))}
  #toast{position:fixed; top:70px}
  #admin{border-radius:14px; height:auto}
  #sidebar{display:none}
  #mobileNav{display:flex}
  #adminMain{min-height:0}
  #adminScroll{overflow:visible; padding:14px}
  .statsRow{grid-template-columns:repeat(2,1fr)}
}

/* new dashboard widgets */
#sidebar .navGroup{font-size:10.5px; font-weight:800; color:#52525b; padding:12px 10px 5px}
.stack{display:flex; flex-direction:column; gap:10px}
.panel.note{background:var(--mint); border-color:var(--mint2); color:#0a5c44; font-size:12.5px; line-height:1.8; display:block}
.panel.warn{background:var(--amber-soft); border-color:#fcd34d; color:#7c4a03; font-size:12.5px; display:block}
.lrow{display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px dashed var(--page-line); flex-wrap:wrap}
.lrow:last-child{border-bottom:0}
.lrow .lmain{flex:1; min-width:180px; display:flex; flex-direction:column; gap:2px}
.lrow .lmain b{font-size:13.5px; display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.lrow.doneRow{opacity:.55}
.abtn.ghost{background:var(--page-bg); color:var(--page-muted); border:1px solid var(--page-line)}
.abtn.doneOn{background:var(--mint); color:var(--em)}
.mrow.hiddenRow{opacity:.5}
.tagOff{font-size:10.5px; font-weight:800; background:var(--zinc-soft); color:var(--zinc); border-radius:99px; padding:2px 8px}
.priceEdit{display:flex; align-items:center; gap:5px; flex:0 0 auto}
.pin{width:82px; background:var(--page-card); border:1px solid var(--page-line); border-radius:9px; padding:6px 8px; font-size:12.5px; color:var(--page-ink); text-align:center}
.pin:focus{outline:2px solid var(--em2); outline-offset:1px}
.priceEdit .unit{font-size:10.5px; color:var(--page-muted); min-width:52px}
.rrow{display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px dashed var(--page-line); font-size:13px}

// ---------- state ----------
var LS = 'hf_proto_v3';
var state = {
  orders: [], seq: 100,
  hidden: {},      // menu item id -> hidden from the app
  rates: {},       // id -> per-100g price override
  prices: {},      // id -> piece price override
  planPrices: {},  // plan id -> price
  subStatus: {},   // subscription id -> status override
  delivered: {},   // subscription id -> delivered today
  selections: {}, // date -> tomorrow's meal picks
  settings: { cutoff: '21:00', reminder: 2, pay: 'الدفع عند الاستلام من المطعم' },
};
try {
  var saved = JSON.parse(localStorage.getItem(LS));
  if (saved) Object.keys(state).forEach(function (k) { if (saved[k] != null) state[k] = saved[k]; });
} catch (e) {}
function save() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }
function resetDemo() { try { localStorage.removeItem(LS); } catch (e) {} location.reload(); }

var ITEMS = DATA.items, IMGS = DATA.imgs, SUBS = DATA.subs, CUSTOMERS = DATA.customers,
    RATINGS = DATA.ratings, PLANS = DATA.plans, DELIVERIES = DATA.deliveries;

var cart = {};        // id -> {grams} | {qty}
var note = '';
var tab = 'home';     // home | menu | orders | profile
var activeCat = null;
var sheetItemId = null;
var sGrams = 100, sQty = 1;
var adminView = 'orders';
var adminFilter = 'open';

var byId = {}; ITEMS.forEach(function (i) { byId[i.id] = i; });
function weighted(i) { return i.cat === 'protein' || i.cat === 'carb'; }
function fmt(n) { return (Math.round(n * 100) / 100).toFixed(2); }
var SAR = 'ر.س';
var STATUS_AR = { new: 'جديد', ready: 'جاهز للاستلام', picked_up: 'تم الاستلام', cancelled: 'ملغي' };
var CAT_AR = { protein: 'بروتين', carb: 'كارب', substitute: 'بدائل الوجبات', snack: 'سناك' };

// Owner overrides from the dashboard win over the seeded values.
function isHidden(i) { return state.hidden[i.id] != null ? !!state.hidden[i.id] : !i.active; }
function rateOf(i) { return state.rates[i.id] !== undefined ? state.rates[i.id] : i.rate; }
function priceOf(i) { return state.prices[i.id] !== undefined ? state.prices[i.id] : i.price; }
function sellable(i) { return weighted(i) ? rateOf(i) != null : priceOf(i) != null; }
function inApp(i) { return !isHidden(i) && sellable(i); }
function planPrice(p) { return state.planPrices[p.id] !== undefined ? state.planPrices[p.id] : p.price; }
function subStatus(s) { return state.subStatus[s.id] || s.status; }

// Rebuilt whenever the owner hides an item or changes a price.
var SECTIONS = [];
function refreshSections() {
  var s = [];
  var prot = ITEMS.filter(function (i) { return i.cat === 'protein' && inApp(i); });
  if (prot.length) s.push({ key: 'protein', label: 'بروتين', items: prot });
  var carb = ITEMS.filter(function (i) { return i.cat === 'carb' && inApp(i); });
  if (carb.length) s.push({ key: 'carb', label: 'كارب', items: carb });
  var sub = ITEMS.filter(function (i) { return i.cat === 'substitute' && inApp(i); });
  if (sub.length) s.push({ key: 'substitute', label: 'بدائل الوجبات', items: sub });
  ITEMS.filter(function (i) { return i.cat === 'snack' && inApp(i); }).forEach(function (i) {
    var label = i.group || 'سناك', key = 'snack:' + label;
    var g = s.filter(function (x) { return x.key === key; })[0];
    if (!g) { g = { key: key, label: label, items: [] }; s.push(g); }
    g.items.push(i);
  });
  SECTIONS = s;
  if (activeCat && !SECTIONS.filter(function (x) { return x.key === activeCat; })[0]) activeCat = null;
}

function linePrice(id, line) {
  var it = byId[id]; if (!it) return 0;
  return line.grams != null ? line.grams / 100 * (rateOf(it) || 0) : (line.qty || 0) * (priceOf(it) || 0);
}
function cartEntries() {
  return Object.keys(cart).map(function (id) { return { id: +id, line: cart[id] }; });
}
function cartTotal() {
  return cartEntries().reduce(function (s, e) { return s + linePrice(e.id, e.line); }, 0);
}
function itemsCountAr(n) { return n === 1 ? 'صنف واحد' : n === 2 ? 'صنفان' : n <= 10 ? n + ' أصناف' : n + ' صنفاً'; }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function lineLabel(l) { return l.grams != null ? l.name + ' — ' + l.grams + 'جم' : l.name + ' × ' + l.qty; }
function $(id) { return document.getElementById(id); }
function imgTag(it, cls) {
  return it.img && IMGS[it.img]
    ? '<img class="' + cls + '" src="' + IMGS[it.img] + '" alt="">'
    : '<div class="noimg ' + cls + '">🍽</div>';
}

// ---------- delegated events (robust: no inline handlers) ----------
document.addEventListener('click', function (ev) {
  var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!el) return;
  var act = el.getAttribute('data-act'), v = el.getAttribute('data-v');
  if (act === 'tab') { tab = v; closeSheets(true); renderPhone(); window.scrollTo(0, 0); }
  else if (act === 'cat') { activeCat = v; renderMenu(); }
  else if (act === 'item') { openItemSheet(+v); }
  else if (act === 'step') { stepSheet(+v); }
  else if (act === 'confirm') { confirmLine(); }
  else if (act === 'removeLine') { removeLine(+v); }
  else if (act === 'openCart') { openCartSheet(); }
  else if (act === 'editLine') { closeSheets(true); openItemSheet(+v); }
  else if (act === 'submit') { submitOrder(); }
  else if (act === 'closeSheets') { closeSheets(); }
  else if (act === 'transition') { transition(+v.split(':')[0], v.split(':')[1]); }
  else if (act === 'filter') { adminFilter = v; renderAdmin(); }
  else if (act === 'adminView') { adminView = v; renderAdmin(); }
  else if (act === 'view') { toggleView(v === 'admin'); }
  else if (act === 'toggleItem') { toggleItem(+v); }
  else if (act === 'activateSub') { activateSub(+v); }
  else if (act === 'cancelSub') { cancelSub(+v); }
  else if (act === 'delivered') { toggleDelivered(+v); }
  else if (act === 'reset') { resetDemo(); }
  else if (act === 'editMeal') { openMealSheet(+v); }
  else if (act === 'editSnack') { openSnackSheet(); }
  else if (act === 'pickTab') { pickTab = v; drawPickSheet(); }
  else if (act === 'pickGrams') { pickGrams(+v.split(':')[0], +v.split(':')[1]); }
  else if (act === 'pickSub') { pickSub(+v); }
  else if (act === 'pickSnack') { pickSnack(+v); }
  else if (act === 'saveSel') { saveSelections(); }
});
document.addEventListener('input', function (ev) {
  if (ev.target && ev.target.id === 'noteIn') note = ev.target.value;
});
document.addEventListener('change', function (ev) {
  var el = ev.target;
  if (!el || !el.getAttribute) return;
  var kind = el.getAttribute('data-chg');
  if (!kind) return;
  if (kind === 'price') setItemPrice(+el.getAttribute('data-v'), parseFloat(el.value));
  else if (kind === 'plan') setPlanPrice(+el.getAttribute('data-v'), parseFloat(el.value));
  else if (kind === 'cutoff') setSetting('cutoff', el.value);
  else if (kind === 'reminder') setSetting('reminder', parseInt(el.value, 10) || 2);
});

// ---------- وجبات الغد (subscriber picker) ----------
// Domain rules mirrored from the backend: a meal is either a protein group +
// a carb group (each capped at the plan's portion size, grams in steps of 50)
// or a single substitute; plus exactly one snack for the day. Editable until
// the cutoff time the evening before.
var AR_DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
var AR_MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];

function myPlan() {
  var s = SUBS.filter(function (x) { return x.name === 'Hashem' && subStatus(x) === 'active'; })[0];
  return s ? { meals: s.meals, size: s.size, remaining: s.remaining, days: s.days, end: s.end }
           : { meals: 2, size: 200, remaining: 26, days: 26, end: null };
}
function tomorrow() { var d = new Date(); d.setDate(d.getDate() + 1); return d; }
function dayKey(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function dayLabel(d) { return AR_DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + AR_MONTHS[d.getMonth()]; }
function cutoffLabel() {
  var parts = (state.settings.cutoff || '21:00').split(':');
  var h = +parts[0], m = parts[1];
  var suffix = h >= 12 ? 'م' : 'ص', h12 = h % 12 || 12;
  return h12 + ':' + m + ' ' + suffix;
}
function pastCutoff() {
  var parts = (state.settings.cutoff || '21:00').split(':');
  var now = new Date();
  return now.getHours() > +parts[0] || (now.getHours() === +parts[0] && now.getMinutes() >= +parts[1]);
}
function inPicker(i) { return !isHidden(i); }   // subscription meals don't need a takeaway price

function suggestedDay() {
  var plan = myPlan();
  var prot = ITEMS.filter(function (i) { return i.cat === 'protein' && inPicker(i); });
  var carb = ITEMS.filter(function (i) { return i.cat === 'carb' && inPicker(i); });
  var snacks = ITEMS.filter(function (i) { return i.cat === 'snack' && inPicker(i); });
  var meals = [];
  for (var s = 0; s < plan.meals; s++) {
    var items = [];
    if (prot[s % prot.length]) items.push({ id: prot[s % prot.length].id, grams: plan.size });
    if (carb[s % carb.length]) items.push({ id: carb[s % carb.length].id, grams: plan.size });
    meals.push({ items: items, sub: null });
  }
  return { meals: meals, snack: snacks.length ? snacks[0].id : null, saved: false, suggested: true };
}
function daySel() {
  var k = dayKey(tomorrow());
  if (!state.selections[k]) state.selections[k] = suggestedDay();
  var d = state.selections[k];
  var plan = myPlan();
  while (d.meals.length < plan.meals) d.meals.push({ items: [], sub: null });
  d.meals.length = plan.meals;
  return d;
}
function groupGrams(meal, cat) {
  return meal.items.filter(function (x) { return byId[x.id] && byId[x.id].cat === cat; })
    .reduce(function (s, x) { return s + x.grams; }, 0);
}
function mealNutrition(meal) {
  var t = { cal: 0, p: 0, c: 0, f: 0 };
  if (meal.sub) {
    var sb = byId[meal.sub];
    if (sb) { t.cal += sb.cal; t.p += sb.p; t.c += sb.c; t.f += sb.f; }
    return t;
  }
  meal.items.forEach(function (x) {
    var it = byId[x.id]; if (!it) return;
    var f = x.grams / 100;
    t.cal += Math.round(it.cal * f); t.p += it.p * f; t.c += it.c * f; t.f += it.f * f;
  });
  return t;
}
function dayNutrition(d) {
  var t = { cal: 0, p: 0, c: 0, f: 0 };
  d.meals.forEach(function (m) {
    var n = mealNutrition(m);
    t.cal += n.cal; t.p += n.p; t.c += n.c; t.f += n.f;
  });
  if (d.snack && byId[d.snack]) {
    var s = byId[d.snack];
    t.cal += s.cal; t.p += s.p; t.c += s.c; t.f += s.f;
  }
  return t;
}
function mealComplete(m) {
  return !!m.sub || (groupGrams(m, 'protein') > 0 && groupGrams(m, 'carb') > 0);
}
function dayComplete(d) {
  return d.meals.every(mealComplete) && !!d.snack;
}

// --- meal editor sheet ---

function drawPickSheet() {
  var plan = myPlan(), d = daySel();
  var html = '<div class="grab"></div>';

  if (pickSlot === -1) {                       // snack picker: one per day
    var groups = {};
    ITEMS.filter(function (i) { return i.cat === 'snack' && inPicker(i); }).forEach(function (i) {
      var g = i.group || 'سناك';
      (groups[g] = groups[g] || []).push(i);
    });
    html += '<h3>اختر السناك</h3>' + Object.keys(groups).map(function (g) {
      return '<div class="pgroupT">' + g + '</div>' + groups[g].map(function (i) {
        var on = d.snack === i.id;
        return '<button class="prow' + (on ? ' on' : '') + '" data-act="pickSnack" data-v="' + i.id + '">' +
          imgTag(i, 'pthumb') + '<span class="pbody2"><span class="pname">' + i.name + '</span>' +
          (i.cal ? '<span class="pcal num">' + i.cal + ' سعرة</span>' : '') + '</span>' +
          (on ? '<span class="pcheck">✓</span>' : '') + '</button>';
      }).join('');
    }).join('');
    $('pickSheet').innerHTML = html;
    return;
  }

  var meal = d.meals[pickSlot];
  var used = { protein: groupGrams(meal, 'protein'), carb: groupGrams(meal, 'carb') };
  var TABS_P = [['protein', 'بروتين'], ['carb', 'كارب'], ['substitute', 'بديل وجبة']];

  html += '<h3>الوجبة ' + (pickSlot + 1) + '</h3>' +
    '<div class="pseg">' + TABS_P.map(function (t) {
      return '<button class="' + (pickTab === t[0] ? 'on' : '') + '" data-act="pickTab" data-v="' + t[0] + '">' + t[1] +
        (t[0] !== 'substitute' ? ' <span class="num">' + used[t[0]] + '/' + plan.size + '</span>' : '') + '</button>';
    }).join('') + '</div>';

  if (pickTab === 'substitute') {
    html += '<div class="phint">بديل الوجبة يحل محل البروتين والكارب معاً</div>' +
      ITEMS.filter(function (i) { return i.cat === 'substitute' && inPicker(i); }).map(function (i) {
        var on = meal.sub === i.id;
        return '<button class="prow' + (on ? ' on' : '') + '" data-act="pickSub" data-v="' + i.id + '">' +
          imgTag(i, 'pthumb') + '<span class="pbody2"><span class="pname">' + i.name + '</span>' +
          (i.cal ? '<span class="pcal num">' + i.cal + ' سعرة</span>' : '') + '</span>' +
          (on ? '<span class="pcheck">✓</span>' : '') + '</button>';
      }).join('');
  } else {
    var remaining = plan.size - used[pickTab];
    html += '<div class="phint">المتبقي في هذه المجموعة: <b class="num">' + remaining + ' جم</b> من ' + plan.size +
      ' — يمكنك مزج أكثر من صنف</div>' +
      ITEMS.filter(function (i) { return i.cat === pickTab && inPicker(i); }).map(function (i) {
        var chosen = meal.items.filter(function (x) { return x.id === i.id; })[0];
        var ctrl;
        if (chosen) {
          ctrl = '<span class="pstep">' +
            '<button data-act="pickGrams" data-v="' + i.id + ':-50">−</button>' +
            '<span class="num">' + chosen.grams + ' جم</span>' +
            '<button data-act="pickGrams" data-v="' + i.id + ':50"' + (remaining < 50 ? ' disabled' : '') + '>+</button></span>';
        } else {
          ctrl = '<button class="padd" data-act="pickGrams" data-v="' + i.id + ':50"' +
            (remaining < 50 ? ' disabled' : '') + '>إضافة</button>';
        }
        return '<div class="prow' + (chosen ? ' on' : '') + '">' + imgTag(i, 'pthumb') +
          '<span class="pbody2"><span class="pname">' + i.name + '</span>' +
          (i.cal ? '<span class="pcal num">' + i.cal + ' سعرة/١٠٠جم</span>' : '') + '</span>' + ctrl + '</div>';
      }).join('');
  }

  html += '<button class="cta" data-act="closeSheets">تم</button>';
  $('pickSheet').innerHTML = html;
}

function pickGrams(id, delta) {
  var d = daySel(), meal = d.meals[pickSlot], it = byId[id], plan = myPlan();
  if (!it) return;
  var chosen = meal.items.filter(function (x) { return x.id === id; })[0];
  var used = groupGrams(meal, it.cat);

  if (delta > 0 && used + delta > plan.size) return;          // group cap
  if (chosen) {
    chosen.grams += delta;
    if (chosen.grams < 50) meal.items = meal.items.filter(function (x) { return x.id !== id; });
  } else if (delta > 0) {
    meal.items.push({ id: id, grams: delta });
  }
  meal.sub = null;                                            // items and a substitute are exclusive
  d.suggested = false; d.saved = false;
  save(); drawPickSheet(); renderPicker();
}
function pickSub(id) {
  var d = daySel(), meal = d.meals[pickSlot];
  meal.sub = meal.sub === id ? null : id;
  if (meal.sub) meal.items = [];
  d.suggested = false; d.saved = false;
  save(); drawPickSheet(); renderPicker();
}
function pickSnack(id) {
  var d = daySel();
  d.snack = id; d.suggested = false; d.saved = false;
  save(); closeSheets(); renderPicker();
}
function saveSelections() {
  var d = daySel();
  if (!dayComplete(d)) { toast('أكمل كل وجبة (بروتين + كارب أو بديل) واختر السناك'); return; }
  d.saved = true; d.suggested = false;
  save(); renderPicker(); renderAdmin();
  toast('تم حفظ اختيارات الغد ✓ — المطبخ سيحضّرها');
}

        '<div class="stat"><div class="sv num">' + RATINGS.length + '</div><div class="sl">أصناف مُقيّمة</div></div>' +
        '<div class="stat"><div class="sv num">' + Math.round(totalUp / Math.max(1, totalUp + totalDown) * 100) + '%</div><div class="sl">نسبة الرضا</div></div>' +

      '<div class="panel"><h4>التقييم لكل صنف — الأكثر تقييماً أولاً</h4>' + RATINGS.map(function (r) {

          '<span class="bar"><span class="fill" style="width:' + pct + '%"></span></span>' +

  plans: function () {
    var unset = PLANS.filter(function (p) { return !planPrice(p); }).length;
    return (unset ? '<div class="panel warn"><b>' + unset + ' خطة بلا سعر</b> — لن يستطيع العميل الاشتراك قبل تحديد الأسعار.</div>' : '') +
      [1, 2, 3, 4].map(function (m) {
        var list = PLANS.filter(function (p) { return p.meals === m; });
        if (!list.length) return '';
        return '<div class="panel"><h4>' + m + ' وجبة يومياً (' + list.length + ' خطة)</h4>' + list.map(function (p) {
          return '<div class="mrow"><span class="mn">حصة ' + p.size + ' جم · ' + p.days + ' يوم</span>' +
            '<span class="priceEdit"><input class="pin num" type="number" min="0" step="10" value="' +
              (planPrice(p) ? planPrice(p) : '') + '" placeholder="غير محدد" data-chg="plan" data-v="' + p.id + '">' +
              '<span class="unit">ر.س</span></span></div>';
        }).join('') + '</div>';
      }).join('');
  },

  settings: function () {
    var s = state.settings;
    return '<div class="panel"><h4>إعدادات التشغيل</h4>' +
        '<div class="setRow"><b>وقت إقفال اختيار وجبات الغد</b>' +
          '<input class="pin" type="time" value="' + s.cutoff + '" data-chg="cutoff"></div>' +
        '<div class="setRow"><b>التذكير قبل الإقفال (ساعات)</b>' +
          '<input class="pin num" type="number" min="1" max="12" value="' + s.reminder + '" data-chg="reminder"></div>' +
        '<div class="setRow"><b>طريقة الدفع (تيك أواي)</b><span>' + esc(s.pay) + '</span></div>' +
        '<div class="setRow"><b>حالات الطلب</b><span>جديد ← جاهز للاستلام ← تم الاستلام (أو إلغاء)</span></div>' +
        '<div class="setRow"><b>حالات الاشتراك</b><span>بانتظار الدفع ← نشط ← منتهي (أو ملغي)</span></div>' +
      '</div>' +
      '<div class="panel"><h4>عن هذا النموذج</h4>' +
        '<div class="setRow"><b>البيانات</b><span>من قاعدة البيانات الحقيقية: ' + ITEMS.length + ' صنفاً · ' +
          SUBS.length + ' اشتراكاً · ' + CUSTOMERS.length + ' عميلاً</span></div>' +
        '<div class="setRow"><b>الحفظ</b><span>كل تغيير يُحفظ في هذا المتصفح فقط — لا يمس النظام الحقيقي</span></div>' +
        '<div class="setRow"><b>إعادة الضبط</b><button class="abtn cancel" data-act="reset">مسح بيانات التجربة</button></div>' +
      '</div>';
  },
};


// ---------- horizontal scrollers ----------
// The rails hold more cards than fit. Touch flicks them natively, but a mouse
// can neither drag an overflow container nor push it sideways with a vertical
// wheel — so wire both up. Physics note: content follows the pointer, and for
// RTL the "later" items sit further left, i.e. at a smaller scrollLeft.
var HSCROLL = '.rail, .cattabs, #mobileNav';

document.addEventListener('pointerdown', function (ev) {
  if (ev.pointerType === 'touch' || ev.button !== 0) return;   // touch already works
  var rail = ev.target.closest ? ev.target.closest(HSCROLL) : null;
  if (!rail || rail.scrollWidth <= rail.clientWidth + 2) return;

  var startX = ev.clientX, startLeft = rail.scrollLeft, dragged = false;

  function move(e) {
    var dx = e.clientX - startX;
    if (Math.abs(dx) > 3) { dragged = true; rail.classList.add('dragging'); }
    rail.scrollLeft = startLeft - dx;
    e.preventDefault();
  }
  function up() {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    rail.classList.remove('dragging');
    // a drag that ends on a card must not also open that card
    if (dragged) document.addEventListener('click', function (c) {
      c.stopPropagation(); c.preventDefault();
    }, { capture: true, once: true });
  }
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
});

document.addEventListener('wheel', function (ev) {
  var rail = ev.target.closest ? ev.target.closest(HSCROLL) : null;
  if (!rail || rail.scrollWidth <= rail.clientWidth + 2) return;
  if (Math.abs(ev.deltaX) >= Math.abs(ev.deltaY)) return;      // trackpad already horizontal
  rail.scrollLeft -= ev.deltaY;
  ev.preventDefault();
}, { passive: false });

// ---------- view / layout ----------
function toggleView(admin) {
  document.body.classList.toggle('showAdmin', admin);
  $('tgApp').classList.toggle('on', !admin);
  $('tgAdmin').classList.toggle('on', admin);
  window.scrollTo(0, 0);
}
function fitPhone() {
  var ph = $('phone'), wrap = $('phoneWrap');
  if (window.innerWidth <= 920) { ph.style.transform = ''; return; }
  ph.style.transform = 'scale(' + Math.min(1, wrap.clientHeight / 780) + ')';
}
window.addEventListener('resize', fitPhone);
function tickClock() {
  var el = $('clock');
  if (el) el.textContent = new Date().toLocaleTimeString('ar-SA', { hour: 'numeric', minute: '2-digit' });
}
setInterval(tickClock, 30000);

// expose for debugging / resilience against module scoping
window.goTab = function (t) { tab = t; renderPhone(); };
window.renderPhone = renderPhone;
window.renderAdmin = renderAdmin;

tickClock(); refreshSections(); renderPhone(); renderAdmin(); fitPhone();
</script>
